# Render Blueprint for the TaskFlow API (Render dashboard → New → Blueprint).
# The same settings can be entered by hand under New → Web Service; see
# "Deployment" in README.md. No Docker: Render's native runtimes include Bun,
# and BUN_VERSION below pins the version (Render reads it before any file; a
# .bun-version file is only honoured at the repo root, which CI also uses).
services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    # Same region as the Supabase database (AWS ap-southeast-1, Singapore): every request makes database
    # round trips, so crossing an ocean here would slow the whole app. Not changeable
    # later without recreating the service.
    region: singapore
    rootDir: backend
    buildCommand: bun install --frozen-lockfile --production
    startCommand: bun src/server.ts
    # Liveness only: Render calls this every 5 s and it never queries the database, so
    # health checks put no load on the pooler. /api/v1/health/db is for manual checks.
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.4.0
      # Browser → Vercel (/api rewrite) → Render: two proxies in front of the app.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: FRONTEND_URL
        value: https://taskflow.sarveshgaynar.in
      - key: CORS_ORIGIN
        value: https://taskflow.sarveshgaynar.in
      - key: GOOGLE_REDIRECT_URI
        value: https://taskflow.sarveshgaynar.in/api/v1/auth/google/callback
      # Sender for invite emails; the domain must be verified in Resend.
      - key: EMAIL_FROM
        value: TaskFlow <invites@taskflow.sarveshgaynar.in>
      # Secrets: values are entered in the Render dashboard, never committed.
      - key: DATABASE_URL # Supabase *session pooler* string + uselibpqcompat=true&sslmode=require
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY # Resend → API Keys (sending access)
        sync: false
      # Render generates a random value; it never passes through git or chat.
      - key: JWT_SECRET
        generateValue: true
