name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup appends "-test" to the database name and refuses anything else.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskflow
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: backend/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:db:setup
      - run: bun run test
      # Deploys apply db/migrations to an empty database: prove that still works.
      - name: Migrations apply to an empty database
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE migration_check'
          DATABASE_URL='postgres://postgres:postgres@localhost:5432/migration_check?sslmode=disable' bun run db:migrate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: backend/.bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npx oxlint
      # Typechecks, then builds exactly what Vercel will build.
      - run: bun run build
      - run: npx vitest run --maxWorkers=2
